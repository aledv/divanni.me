server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # bot/scanner requests for missing files: keep the 404, skip the error.log line
    log_not_found off;

    include /etc/nginx/snippets/security-headers.conf;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|otf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        access_log off;
    }
}
